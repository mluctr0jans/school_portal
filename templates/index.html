<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>School Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <!-- Student login: username=student, password=student123 -->
    <main class="card">
      <p class="eyebrow">STUDENT SERVICES</p>
      <h1>School Portal</h1>
      <p class="intro">Sign in to view your school account.</p>

      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="account" class="account" hidden>
        <p>Signed in as <strong id="account-name"></strong> (<span id="account-role"></span>).</p>
        <p><a href="/admin/dashboard">Open the administrator dashboard</a></p>
        <button id="logout" class="secondary" type="button">Sign out</button>
      </section>

      <footer class="site-footer">
        <p class="footer-label">Find us online</p>
        <nav class="social-links" aria-label="Social media links">
          <a href="https://www.instagram.com/schoolportal.demo/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://www.facebook.com/schoolportal.demo/" target="_blank" rel="noopener noreferrer">Facebook</a>
          <a href="https://x.com/schoolportal_demo" target="_blank" rel="noopener noreferrer">X</a>
          <a href="https://www.tiktok.com/@schoolportal_demo" target="_blank" rel="noopener noreferrer">TikTok</a>
          <a href="https://www.youtube.com/@schoolportal_demo" target="_blank" rel="noopener noreferrer">YouTube</a>
          <a href="https://www.linkedin.com/company/schoolportal-demo/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://discord.com/invite/schoolportal-demo" target="_blank" rel="noopener noreferrer">Discord</a>
          <a href="https://www.reddit.com/user/schoolportal_demo/" target="_blank" rel="noopener noreferrer">Reddit</a>
          <a href="https://t.me/schoolportal_demo" target="_blank" rel="noopener noreferrer">Telegram</a>
          <a href="https://www.threads.net/@schoolportal_demo" target="_blank" rel="noopener noreferrer">Threads</a>
          <a href="https://www.pinterest.com/schoolportal_demo/" target="_blank" rel="noopener noreferrer">Pinterest</a>
          <a href="https://www.snapchat.com/add/schoolportal_demo" target="_blank" rel="noopener noreferrer">Snapchat</a>
          <a href="https://www.twitch.tv/schoolportal_demo" target="_blank" rel="noopener noreferrer">Twitch</a>
          <a href="https://github.com/mluctr0jans" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </footer>

    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
